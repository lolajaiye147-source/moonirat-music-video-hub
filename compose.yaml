services:
  moonirat:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - supabase_url
        - supabase_publishable_key
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_PATH: /
    ports:
      - "3000:3000"
    restart: unless-stopped

secrets:
  supabase_url:
    environment: VITE_SUPABASE_URL
  supabase_publishable_key:
    environment: VITE_SUPABASE_PUBLISHABLE_KEY