version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moonirat-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: moonirat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d moonirat']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: moonirat-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - '3000:3000'
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  postgres_data:
