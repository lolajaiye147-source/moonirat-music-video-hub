version: '3.9'

networks:
  moonirat-network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: moonirat-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: moonirat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moonirat-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d moonirat_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: moonirat-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - '4000:4000'
    networks:
      - moonirat-network
    command: sh -c "npx prisma migrate deploy && node dist/main"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
