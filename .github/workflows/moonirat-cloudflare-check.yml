name: Moonirat Cloudflare preparation

on:
  push:
    branches:
      - deploy/cloudflare-workers-v1
    paths:
      - "artifacts/moonirat/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/moonirat-cloudflare-check.yml"
  pull_request:
    branches:
      - deploy/cloudflare-workers-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonirat-cloudflare-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://pfjwulgedqvtolaazdap.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CP5ozs7CICFszG2zbzt8Gg_4n6g6wa4
      SUPABASE_URL: https://pfjwulgedqvtolaazdap.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_CP5ozs7CICFszG2zbzt8Gg_4n6g6wa4
      NODE_ENV: production

    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies with lockfile enforcement
        run: pnpm install --frozen-lockfile

      - name: Type-check Moonirat
        run: pnpm --filter @workspace/moonirat typecheck

      - name: Build Moonirat
        run: pnpm --filter @workspace/moonirat build
