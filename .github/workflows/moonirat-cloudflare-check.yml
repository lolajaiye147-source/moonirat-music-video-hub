name: Moonirat Cloudflare preparation

on:
  push:
    branches:
      - deploy/cloudflare-workers-v1
    paths:
      - "artifacts/moonirat/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/moonirat-cloudflare-check.yml"
  pull_request:
    branches:
      - deploy/cloudflare-workers-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moonirat-cloudflare-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://pfjwulgedqvtolaazdap.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CP5ozs7CICFszG2zbzt8Gg_4n6g6wa4
      SUPABASE_URL: https://pfjwulgedqvtolaazdap.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_CP5ozs7CICFszG2zbzt8Gg_4n6g6wa4

    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (refresh lockfile only if needed)
        run: |
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Commit lockfile synchronization if needed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync pnpm lockfile for deployment branch'
            git push
          fi

      - name: Type-check Moonirat
        run: pnpm --filter @workspace/moonirat typecheck

      - name: Build Moonirat
        run: NODE_ENV=production pnpm --filter @workspace/moonirat build

      - name: Inspect generated Cloudflare Worker bundle
        working-directory: artifacts/moonirat
        run: |
          echo '--- generated wrangler config ---'
          cat dist/server/wrangler.json
          echo '--- Nitro deployment metadata ---'
          cat dist/nitro.json
          echo '--- server entry and generated modules ---'
          find dist/server -maxdepth 2 -type f | sort | head -100
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('dist/server/wrangler.json','utf8')); if (!c.main) throw new Error('Worker main entry is missing'); if (!fs.existsSync('dist/server/'+c.main.replace(/^\.\//,''))) throw new Error('Worker main entry does not exist: '+c.main); console.log('Worker main entry verified:',c.main);"
