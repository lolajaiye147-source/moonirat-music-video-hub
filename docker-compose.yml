version: '3.9'

networks:
  moonirat-network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: moonirat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moonirat
      POSTGRES_PASSWORD: moonirat_pass
      POSTGRES_DB: moonirat_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moonirat-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moonirat -d moonirat_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moonirat-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://moonirat:moonirat_pass@postgres:5432/moonirat_db?schema=public
      JWT_SECRET: super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 7d
      AWS_ACCESS_KEY_ID: changeme
      AWS_SECRET_ACCESS_KEY: changeme
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: moonirat-videos
      AWS_S3_ENDPOINT: https://s3.amazonaws.com
      PORT: 4000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - moonirat-network
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moonirat-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - moonirat-network
